services:
  analysis:
    networks:
      - infodengue
    environment:
      ALERTA_DB_HOST: ${ALERTA_DB_HOST:?ALERTA_DB_HOST is required}
      ALERTA_DB_PORT: ${ALERTA_DB_PORT:-5432}
      ALERTA_DB_NAME: ${ALERTA_DB_NAME:?ALERTA_DB_NAME is required}
      ALERTA_DB_USER: ${ALERTA_DB_USER:?ALERTA_DB_USER is required}
      ALERTA_DB_PASSWORD: ${ALERTA_DB_PASSWORD:?ALERTA_DB_PASSWORD is required}

networks:
  infodengue:
    external: true
    name: ${INFODENGUE_NETWORK:-infodengue-staging_infodengue}
