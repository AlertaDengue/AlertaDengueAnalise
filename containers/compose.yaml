services:
  analysis:
    build:
      context: ..
      dockerfile: containers/Dockerfile
    image: ${ALERTA_ANALYSIS_IMAGE:-alertadengueanalise:local}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: ["makim", "--help"]
    environment:
      ALERTA_OUT_DIR: /outputs
    volumes:
      - ${ALERTA_OUTPUT_DIR:-../artifacts}:/outputs
    restart: "no"
    stdin_open: false
    tty: false
