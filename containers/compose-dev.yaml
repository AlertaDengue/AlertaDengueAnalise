services:
  analysis:
    networks:
      - infodengue
    environment:
      ALERTA_DB_HOST: >-
        ${ALERTA_DB_HOST:-${DB_HOST:?Deployment configuration error: set ALERTA_DB_HOST or DB_HOST in repository-root .env}}
      ALERTA_DB_PORT: ${ALERTA_DB_PORT:-${DB_PORT:-5432}}
      ALERTA_DB_NAME: >-
        ${ALERTA_DB_NAME:-${DB_NAME:?Deployment configuration error: set ALERTA_DB_NAME or DB_NAME in repository-root .env}}
      ALERTA_DB_USER: >-
        ${ALERTA_DB_USER:-${DB_USER:?Deployment configuration error: set ALERTA_DB_USER or DB_USER in repository-root .env}}
      ALERTA_DB_PASSWORD: >-
        ${ALERTA_DB_PASSWORD:-${DB_PASSWORD:?Deployment configuration error: set ALERTA_DB_PASSWORD or DB_PASSWORD in repository-root .env}}

networks:
  infodengue:
    external: true
    name: ${INFODENGUE_NETWORK:-infodengue-dev_infodengue}
