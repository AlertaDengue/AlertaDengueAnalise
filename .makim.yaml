groups:
  deps:
    tasks:
      install:
        help: "Instalar dependências de R dentro do ambiente conda (CRAN + GitHub)."
        args:
          env:
            help: "Nome do ambiente conda."
            type: string
            default: alertadengueanalise
        env:
          MAKEFLAGS: "-j1"
        backend: bash
        run: |
          ${CONDA_EXE:-conda} run --no-capture-output -n "${{ args.env }}" \
            Rscript --vanilla scripts/install_deps.R

      install-inla:
        help: Install and validate R-INLA (minimal)
        args:
          env:
            help: "Conda env for AlertaDengueAnalise."
            type: string
            required: false
        backend: bash
        run: |
          bash scripts/install_inla.sh "${{ args.env }}"

      check:
        help: "Teste rápido de pacotes críticos após a instalação."
        args:
          env:
            help: "Nome do ambiente conda."
            type: string
            default: alertadengueanalise
        backend: bash
        run: |
          ${CONDA_EXE:-conda} run --no-capture-output -n "${{ args.env }}" Rscript --vanilla -e \
            'stopifnot(requireNamespace("zendown"), requireNamespace("brpop"), requireNamespace("AlertTools")); cat("OK\n")'

  db:
    tasks:
      check:
        help: "Verificar conexão com o Postgres usando variáveis do arquivo .env."
        backend: bash
        args:
          env:
            help: "Nome do ambiente conda."
            type: string
            default: alertadengueanalise
        run: |
          set -euo pipefail

          if [ -f .env ]; then
            set -a
            . ./.env
            set +a
          fi

          ${CONDA_EXE:-conda} run --no-capture-output -n "${{ args.env }}" \
            Rscript --vanilla scripts/db_check.R

  pipeline:
    tasks:
      run-br:
        help: "Executar o pipeline BR para uma semana epidemiológica (YYYYWW)."
        backend: bash
        args:
          env:
            help: "Nome do ambiente conda."
            type: string
            default: alertadengueanalise
          week:
            help: "Semana epidemiológica no formato YYYYWW (ex.: 202601)."
            type: string
            required: true
          scp:
            help: "Se true, publica os .RData via SCP usando ALERTA_SCP_ENDPOINT e ALERTA_SCP_PATH do .env."
            type: bool
            default: false
          cores:
            help: "Número de estados processados em paralelo via parallel::mclapply em R."
            type: string
            default: "1"
        run: |
          set -euo pipefail

          if [ -f .env ]; then
            set -a
            . ./.env
            set +a
          fi

          if ! [[ "${{ args.week }}" =~ ^[0-9]{6}$ ]]; then
            echo "ERRO: --week deve estar no formato YYYYWW (6 dígitos), recebido '${{ args.week }}'."
            exit 2
          fi

          if ! [[ "${{ args.cores }}" =~ ^[0-9]+$ ]] || [ "${{ args.cores }}" -lt 1 ]; then
            echo "ERRO: --cores deve ser inteiro positivo."
            exit 2
          fi

          export ALERTA_DATA_RELATORIO="${{ args.week }}"
          export ALERTA_REPORT_EPIWEEK="${{ args.week }}"
          export ALERTA_DO_SCP="${{ args.scp }}"
          export ALERTA_PARALLEL_CORES="${{ args.cores }}"
          export OMP_NUM_THREADS=1
          export OPENBLAS_NUM_THREADS=1
          export MKL_NUM_THREADS=1
          export BLIS_NUM_THREADS=1
          export VECLIB_MAXIMUM_THREADS=1
          export RCPP_PARALLEL_NUM_THREADS=1

          LOG_DIR="${ALERTA_LOG_DIR:-}"
          if [ -z "${LOG_DIR}" ]; then
            if [ -n "${ALERTA_OUT_DIR:-}" ]; then
              LOG_DIR="${ALERTA_OUT_DIR}/logs"
            else
              LOG_DIR="logs"
            fi
          fi
          mkdir -p "${LOG_DIR}"

          LOG_FILE="${LOG_DIR}/pipeline-${{ args.week }}-$(date +%Y%m%d-%H%M%S).log"

          ${CONDA_EXE:-conda} run --no-capture-output -n "${{ args.env }}" \
            Rscript --vanilla main/main_BR.R 2>&1 | \
            tee -a "${LOG_FILE}"

      refresh-alertas:
        help: "Executar geração BR de alertas, exportar SQL e carregar dengue/chik no banco."
        backend: bash
        args:
          env:
            help: "Nome do ambiente conda."
            type: string
            default: alertadengueanalise
          week:
            help: "Semana epidemiológica no formato YYYYWW."
            type: string
            required: true
          window-weeks:
            help: "Janela histórica em semanas para tabela_historico."
            type: string
            default: "100"
          states:
            help: "Lista opcional de UFs separadas por vírgula (ex.: RJ ou RJ,ES,MG)."
            type: string
            required: false
            default: ""
          load:
            help: "Se presente, aplica os SQLs gerados no banco."
            type: bool
            default: false
          scp:
            help: "Se true, publica os .RData via SCP usando ALERTA_SCP_ENDPOINT e ALERTA_SCP_PATH do .env."
            type: bool
            default: false
          cores:
            help: "Número de estados processados em paralelo via parallel::mclapply em R."
            type: string
            default: "1"
        run: |
          set -euo pipefail

          if [ -f .env ]; then
            set -a
            . ./.env
            set +a
          fi

          WEEK="${{ args.week }}"

          if ! [[ "${WEEK}" =~ ^[0-9]{6}$ ]]; then
            echo "ERRO: semana epidemiológica inválida: ${WEEK}"
            exit 2
          fi

          if ! [[ "${{ args.window_weeks }}" =~ ^[0-9]+$ ]]; then
            echo "ERRO: --window-weeks deve ser inteiro positivo."
            exit 2
          fi

          if ! [[ "${{ args.cores }}" =~ ^[0-9]+$ ]] || [ "${{ args.cores }}" -lt 1 ]; then
            echo "ERRO: --cores deve ser inteiro positivo."
            exit 2
          fi

          ROOT_DIR="$(pwd)"
          OUT_BASE="${ALERTA_OUT_DIR:-${ROOT_DIR}/main}"
          SQL_DIR="${OUT_BASE}/sql"

          DENGUE_SQL="${SQL_DIR}/output_dengue.sql"
          CHIK_SQL="${SQL_DIR}/output_chik.sql"

          DB_HOST="${ALERTA_DB_HOST:-${DB_HOST:-}}"
          DB_PORT="${ALERTA_DB_PORT:-${DB_PORT:-5432}}"
          DB_NAME="${ALERTA_DB_NAME:-${DB_NAME:-}}"
          DB_USER="${ALERTA_DB_USER:-${DB_USER:-}}"
          DB_PASS="${ALERTA_DB_PASSWORD:-${DB_PASSWORD:-}}"

          if [ -z "${DB_HOST}" ] || [ -z "${DB_NAME}" ] || [ -z "${DB_USER}" ] || [ -z "${DB_PASS}" ]; then
            echo "ERRO: faltam variáveis de banco. Defina ALERTA_DB_* ou DB_* no ambiente ou .env."
            exit 2
          fi

          export ALERTA_DATA_RELATORIO="${WEEK}"
          export ALERTA_REPORT_EPIWEEK="${WEEK}"
          export ALERTA_WINDOW_WEEKS="${{ args.window_weeks }}"
          export ALERTA_DO_SCP="${{ args.scp }}"
          export ALERTA_STATES="${{ args.states }}"
          export ALERTA_PARALLEL_CORES="${{ args.cores }}"
          export OMP_NUM_THREADS=1
          export OPENBLAS_NUM_THREADS=1
          export MKL_NUM_THREADS=1
          export BLIS_NUM_THREADS=1
          export VECLIB_MAXIMUM_THREADS=1
          export RCPP_PARALLEL_NUM_THREADS=1

          LOG_DIR="${ALERTA_LOG_DIR:-}"
          if [ -z "${LOG_DIR}" ]; then
            if [ -n "${ALERTA_OUT_DIR:-}" ]; then
              LOG_DIR="${ALERTA_OUT_DIR}/logs"
            else
              LOG_DIR="logs"
            fi
          fi
          mkdir -p "${LOG_DIR}"

          LOG_FILE="${LOG_DIR}/refresh-alertas-${WEEK}-$(date +%Y%m%d-%H%M%S).log"

          echo "[II] week=${WEEK}" | tee -a "${LOG_FILE}"
          echo "[II] window_weeks=${{ args.window_weeks }}" | tee -a "${LOG_FILE}"
          echo "[II] cores=${{ args.cores }}" | tee -a "${LOG_FILE}"

          if [ -n "${{ args.states }}" ]; then
            echo "[II] states=${{ args.states }}" | tee -a "${LOG_FILE}"
          else
            echo "[II] states=ALL" | tee -a "${LOG_FILE}"
          fi

          ${CONDA_EXE:-conda} run --no-capture-output -n "${{ args.env }}" \
            Rscript --vanilla main/main_BR.R 2>&1 | \
            tee -a "${LOG_FILE}"

          if [ "${{ args.load }}" != "True" ] && [ "${{ args.load }}" != "true" ]; then
            echo "[II] load=false, skipping SQL apply." | tee -a "${LOG_FILE}"
            exit 0
          fi

          if [ -f "${DENGUE_SQL}" ]; then
            echo "[II] applying ${DENGUE_SQL}" | tee -a "${LOG_FILE}"
            PGPASSWORD="${DB_PASS}" \
              psql \
                -v ON_ERROR_STOP=1 \
                -h "${DB_HOST}" \
                -p "${DB_PORT}" \
                -U "${DB_USER}" \
                -d "${DB_NAME}" \
                -f "${DENGUE_SQL}" 2>&1 | \
              tee -a "${LOG_FILE}"
          else
            echo "[WW] ${DENGUE_SQL} not found, skipping." | tee -a "${LOG_FILE}"
          fi

          if [ -f "${CHIK_SQL}" ]; then
            echo "[II] applying ${CHIK_SQL}" | tee -a "${LOG_FILE}"
            PGPASSWORD="${DB_PASS}" \
              psql \
                -v ON_ERROR_STOP=1 \
                -h "${DB_HOST}" \
                -p "${DB_PORT}" \
                -U "${DB_USER}" \
                -d "${DB_NAME}" \
                -f "${CHIK_SQL}" 2>&1 | \
              tee -a "${LOG_FILE}"
          else
            echo "[WW] ${CHIK_SQL} not found, skipping." | tee -a "${LOG_FILE}"
          fi

          echo "[II] refresh-alertas completed successfully." | tee -a "${LOG_FILE}"

      maps-state:
        help: "Gerar mapas estaduais de incidência acumulada nas últimas SEs."
        backend: bash
        args:
          env:
            help: "Nome do ambiente conda."
            type: string
            default: alertadengueanalise
          week:
            help: "Semana epidemiológica no formato YYYYWW, ou 'latest'."
            type: string
            default: latest
          states:
            help: "Lista de UFs separadas por vírgula, ou ALL para todos os estados."
            type: string
            default: ALL
          diseases:
            help: "Lista de agravos separadas por vírgula: dengue, chikungunya, zika, ou ALL."
            type: string
            default: ALL
          output-dir:
            help: "Diretório de saída dos mapas estaduais."
            type: string
            default: sync_maps/incidence_maps/state
          window-weeks:
            help: "Número de semanas usadas para acumular incidência."
            type: string
            default: "4"
        run: |
          set -euo pipefail

          if [ -f .env ]; then
            set -a
            . ./.env
            set +a
          fi

          WEEK="${{ args.week }}"

          if [ "${WEEK}" != "latest" ] && ! [[ "${WEEK}" =~ ^[0-9]{6}$ ]]; then
            echo "ERRO: --week deve ser 'latest' ou uma SE no formato YYYYWW, recebido '${WEEK}'."
            exit 2
          fi

          if ! [[ "${{ args.window_weeks }}" =~ ^[0-9]+$ ]]; then
            echo "ERRO: --window-weeks deve ser inteiro positivo."
            exit 2
          fi

          export ALERTA_MAP_EPIWEEK="${WEEK}"
          export ALERTA_MAP_STATES="${{ args.states }}"
          export ALERTA_MAP_DISEASES="${{ args.diseases }}"
          export ALERTA_MAP_OUTPUT_DIR="${{ args.output_dir }}"
          export ALERTA_MAP_WINDOW_WEEKS="${{ args.window_weeks }}"

          CONDA_BIN="${CONDA_EXE:-conda}"

          CONDA_PREFIX_RESOLVED="$(
            ${CONDA_BIN} run --no-capture-output -n "${{ args.env }}" \
              python -c 'import sys; print(sys.prefix)'
          )"

          if [ -z "${CONDA_PREFIX_RESOLVED}" ]; then
            echo "ERRO: não foi possível resolver o prefixo do ambiente conda '${{ args.env }}'."
            exit 2
          fi

          export PATH="${CONDA_PREFIX_RESOLVED}/bin:${PATH}"

          if [ -f "${CONDA_PREFIX_RESOLVED}/share/proj/proj.db" ]; then
            export PROJ_LIB="${CONDA_PREFIX_RESOLVED}/share/proj"
            export PROJ_DATA="${CONDA_PREFIX_RESOLVED}/share/proj"
          fi

          if [ -d "${CONDA_PREFIX_RESOLVED}/share/gdal" ]; then
            export GDAL_DATA="${CONDA_PREFIX_RESOLVED}/share/gdal"
          fi

          LOG_DIR="${ALERTA_LOG_DIR:-}"
          if [ -z "${LOG_DIR}" ]; then
            if [ -n "${ALERTA_OUT_DIR:-}" ]; then
              LOG_DIR="${ALERTA_OUT_DIR}/logs"
            else
              LOG_DIR="logs"
            fi
          fi
          mkdir -p "${LOG_DIR}"

          LOG_FILE="${LOG_DIR}/maps-state-${WEEK}-$(date +%Y%m%d-%H%M%S).log"

          echo "[II] week=${WEEK}" | tee -a "${LOG_FILE}"
          echo "[II] states=${{ args.states }}" | tee -a "${LOG_FILE}"
          echo "[II] diseases=${{ args.diseases }}" | tee -a "${LOG_FILE}"
          echo "[II] window_weeks=${{ args.window_weeks }}" | tee -a "${LOG_FILE}"
          echo "[II] output_dir=${{ args.output_dir }}" | tee -a "${LOG_FILE}"

          ${CONDA_BIN} run --no-capture-output -n "${{ args.env }}" \
            Rscript --vanilla incidence_maps/state.R 2>&1 | \
            tee -a "${LOG_FILE}"


      maps-br:
        help: "Gerar mapas nacionais de incidência acumulada nas últimas SEs."
        backend: bash
        args:
          env:
            help: "Nome do ambiente conda."
            type: string
            default: alertadengueanalise
          week:
            help: "Semana epidemiológica no formato YYYYWW, ou 'latest'."
            type: string
            default: latest
          diseases:
            help: "Lista de agravos separadas por vírgula: dengue, chikungunya, ou ALL."
            type: string
            default: ALL
          window-weeks:
            help: "Número de semanas usadas para acumular incidência."
            type: string
            default: "4"
          output-dir:
            help: "Diretório de saída dos mapas nacionais."
            type: string
            default: sync_maps/incidence_maps/country
        run: |
          set -euo pipefail

          if [ -f .env ]; then
            set -a
            . ./.env
            set +a
          fi

          WEEK="${{ args.week }}"

          if [ "${WEEK}" != "latest" ] && ! [[ "${WEEK}" =~ ^[0-9]{6}$ ]]; then
            echo "ERRO: --week deve ser 'latest' ou uma SE no formato YYYYWW, recebido '${WEEK}'."
            exit 2
          fi

          if ! [[ "${{ args.window_weeks }}" =~ ^[0-9]+$ ]]; then
            echo "ERRO: --window-weeks deve ser inteiro positivo."
            exit 2
          fi

          export ALERTA_MAP_BR_EPIWEEK="${WEEK}"
          export ALERTA_MAP_BR_DISEASES="${{ args.diseases }}"
          export ALERTA_MAP_BR_WINDOW_WEEKS="${{ args.window_weeks }}"
          export ALERTA_MAP_BR_OUTPUT_DIR="${{ args.output_dir }}"

          CONDA_BIN="${CONDA_EXE:-conda}"

          CONDA_PREFIX_RESOLVED="$(
            ${CONDA_BIN} run --no-capture-output -n "${{ args.env }}" \
              python -c 'import sys; print(sys.prefix)'
          )"

          if [ -z "${CONDA_PREFIX_RESOLVED}" ]; then
            echo "ERRO: não foi possível resolver o prefixo do ambiente conda '${{ args.env }}'."
            exit 2
          fi

          export PATH="${CONDA_PREFIX_RESOLVED}/bin:${PATH}"

          if [ -f "${CONDA_PREFIX_RESOLVED}/share/proj/proj.db" ]; then
            export PROJ_LIB="${CONDA_PREFIX_RESOLVED}/share/proj"
            export PROJ_DATA="${CONDA_PREFIX_RESOLVED}/share/proj"
          fi

          if [ -d "${CONDA_PREFIX_RESOLVED}/share/gdal" ]; then
            export GDAL_DATA="${CONDA_PREFIX_RESOLVED}/share/gdal"
          fi

          LOG_DIR="${ALERTA_LOG_DIR:-}"
          if [ -z "${LOG_DIR}" ]; then
            if [ -n "${ALERTA_OUT_DIR:-}" ]; then
              LOG_DIR="${ALERTA_OUT_DIR}/logs"
            else
              LOG_DIR="logs"
            fi
          fi
          mkdir -p "${LOG_DIR}"

          LOG_FILE="${LOG_DIR}/maps-br-${WEEK}-$(date +%Y%m%d-%H%M%S).log"

          echo "[II] week=${WEEK}" | tee -a "${LOG_FILE}"
          echo "[II] diseases=${{ args.diseases }}" | tee -a "${LOG_FILE}"
          echo "[II] window_weeks=${{ args.window_weeks }}" | tee -a "${LOG_FILE}"
          echo "[II] output_dir=${{ args.output_dir }}" | tee -a "${LOG_FILE}"
          echo "[II] conda_prefix=${CONDA_PREFIX_RESOLVED}" | tee -a "${LOG_FILE}"
          echo "[II] PROJ_LIB=${PROJ_LIB:-}" | tee -a "${LOG_FILE}"
          echo "[II] PROJ_DATA=${PROJ_DATA:-}" | tee -a "${LOG_FILE}"
          echo "[II] GDAL_DATA=${GDAL_DATA:-}" | tee -a "${LOG_FILE}"

          ${CONDA_BIN} run --no-capture-output -n "${{ args.env }}" \
            Rscript --vanilla incidence_maps/br.R 2>&1 | \
            tee -a "${LOG_FILE}"
      refresh-alertas-job:
        help: "Executar análise e mapas sem dependência do repositório AlertaDengue."
        backend: bash
        args:
          env:
            help: "Nome do ambiente conda."
            type: string
            default: alertadengueanalise
          week:
            help: "Semana epidemiológica no formato YYYYWW."
            type: string
            required: true
          window-weeks:
            help: "Janela histórica em semanas para tabela_historico."
            type: string
            default: "100"
          states:
            help: "Lista opcional de UFs separadas por vírgula."
            type: string
            default: ""
          diseases:
            help: "Lista de agravos para os mapas."
            type: string
            default: ALL
          load:
            help: "Se true, aplica os SQLs gerados no banco."
            type: string
            default: "false"
          cores:
            help: "Número de estados processados em paralelo."
            type: string
            default: "1"
        run: |
          set -euo pipefail
          WEEK="${{ args.week }}"
          ROOT_DIR="$(pwd)"
          OUT_BASE="${ALERTA_OUT_DIR:-${ROOT_DIR}/main}"
          MAPS_BASE="${OUT_BASE}/incidence_maps"

          if ! [[ "${WEEK}" =~ ^[0-9]{6}$ ]]; then
            echo "ERRO: --week deve estar no formato YYYYWW."
            exit 2
          fi

          STATES="${{ args.states }}"
          MAP_STATES="${STATES:-ALL}"

          LOAD_ARG=""
          if [ "${{ args.load }}" = "true" ]; then
            LOAD_ARG="--load"
          fi

          makim pipeline.refresh-alertas --env "${{ args.env }}" --week "${WEEK}" --window-weeks "${{ args.window_weeks }}" --states "${{ args.states }}" --cores "${{ args.cores }}" ${LOAD_ARG}

          if [ ! -d "${OUT_BASE}/alertas/${WEEK}" ] || [ -z "$(find "${OUT_BASE}/alertas/${WEEK}" -name '*.RData' -print -quit)" ]; then
            echo "ERRO: nenhum RData estadual foi gerado em ${OUT_BASE}/alertas/${WEEK}."
            exit 1
          fi
          if [ ! -f "${OUT_BASE}/alertas/BR/ale-BR-${WEEK}.RData" ]; then
            echo "ERRO: RData consolidado BR não encontrado."
            exit 1
          fi
          if [ -z "$(find "${OUT_BASE}/sql" -name 'output_*.sql' -print -quit)" ]; then
            echo "ERRO: nenhum SQL de alerta foi gerado em ${OUT_BASE}/sql."
            exit 1
          fi

          if [ "${{ args.load }}" = "true" ]; then
            echo "[II] load=true: generating maps"
            makim pipeline.maps-br --env "${{ args.env }}" --week "${WEEK}" --diseases "${{ args.diseases }}" --output-dir "${MAPS_BASE}/country"
            makim pipeline.maps-state --env "${{ args.env }}" --week "${WEEK}" --states "${MAP_STATES}" --diseases "${{ args.diseases }}" --output-dir "${MAPS_BASE}/state"

            if [ -z "$(find "${MAPS_BASE}" -type f -name '*.png' -print -quit)" ]; then
              echo "ERRO: nenhum mapa PNG foi gerado em ${MAPS_BASE}."
              exit 1
            fi
          else
            echo "[II] load=false: skipping map generation because database was not updated."
          fi

          echo "[II] refresh-alertas-job completed successfully for ${WEEK}"

      refresh-alertas-full:
        help: "Run refresh-alertas, generate maps, publish maps, archive alerts, and update alerta history."
        backend: bash
        args:
          env:
            help: "Conda env for AlertaDengueAnalise."
            type: string
            default: alertadengueanalise
          alerta-env:
            help: "Conda env for AlertaDengue."
            type: string
            default: alertadengue
          week:
            help: "Semana epidemiológica no formato YYYYWW."
            type: string
            required: true
          diseases:
            help: "dengue, chikungunya, zika, or ALL."
            type: string
            default: ALL
          cores:
            help: "Número de cores."
            type: string
            default: "4"
        run: |
          set -euo pipefail

          WEEK="${{ args.week }}"
          DISEASES="${{ args.diseases }}"
          CORES="${{ args.cores }}"
          ROOT_DIR="$(pwd)"
          ALERTADENGUE_DIR="${ROOT_DIR}/../AlertaDengue"
          ALERTS_DIR="${ROOT_DIR}/main/alertas"
          MAPS_SOURCE="${ROOT_DIR}/sync_maps/incidence_maps"
          MAPS_TARGET="${ALERTADENGUE_DIR}/AlertaDengue/static/img/incidence_maps"
          ARCHIVE_FILE="${ROOT_DIR}/alertas_${WEEK}.tar.gz"

          if ! [[ "${WEEK}" =~ ^[0-9]{6}$ ]]; then
            echo "ERRO: --week deve estar no formato YYYYWW."
            exit 2
          fi

          if ! [[ "${CORES}" =~ ^[0-9]+$ ]] || [ "${CORES}" -lt 1 ]; then
            echo "ERRO: --cores deve ser inteiro positivo."
            exit 2
          fi

          if [ ! -d "${ALERTADENGUE_DIR}" ]; then
            echo "ERRO: repositório AlertaDengue não encontrado em ${ALERTADENGUE_DIR}."
            exit 2
          fi

          echo "[II] running refresh-alertas for ${WEEK}"
          makim pipeline.refresh-alertas \
            --env "${{ args.env }}" \
            --week "${WEEK}" \
            --load \
            --cores "${CORES}"

          echo "[II] cleaning generated maps"
          rm -rf "${MAPS_SOURCE}"
          mkdir -p "${MAPS_SOURCE}"

          echo "[II] generating BR maps"
          makim pipeline.maps-br \
            --env "${{ args.env }}" \
            --week "${WEEK}" \
            --diseases "${DISEASES}"

          echo "[II] generating state maps"
          makim pipeline.maps-state \
            --env "${{ args.env }}" \
            --week "${WEEK}" \
            --states ALL \
            --diseases "${DISEASES}"

          if [ ! -d "${MAPS_SOURCE}" ] || [ -z "$(find "${MAPS_SOURCE}" -mindepth 1 -print -quit)" ]; then
            echo "ERRO: nenhum mapa foi gerado em ${MAPS_SOURCE}."
            exit 1
          fi

          echo "[II] publishing maps"
          rm -rf "${MAPS_TARGET}"
          mkdir -p "${MAPS_TARGET}"
          cp -a "${MAPS_SOURCE}/." "${MAPS_TARGET}/"

          if [ ! -d "${ALERTS_DIR}/${WEEK}" ]; then
            echo "ERRO: diretório de alertas não encontrado: ${ALERTS_DIR}/${WEEK}."
            exit 1
          fi

          echo "[II] creating alert archive"
          rm -f "${ARCHIVE_FILE}"
          tar -czf "${ARCHIVE_FILE}" \
            -C "${ALERTS_DIR}" \
            "${WEEK}"

          echo "[II] updating historico_alerta in AlertaDengue"
          (
            cd "${ALERTADENGUE_DIR}"
            "${CONDA_EXE:-conda}" run --no-capture-output \
              -n "${{ args.alerta_env }}" \
              bash update_historico_alerta.sh
          )

          echo "[II] full refresh completed successfully for ${WEEK}"

  release:
    tasks:
      ci:
        help: Create GitHub release + bump DESCRIPTION version (patch)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rscript -e '
          ver <- read.dcf("DESCRIPTION", fields="Version")[1,1];
          new_ver <- usethis:::bump_version(ver, "patch");
          cat("Bumped to:", new_ver, "\n");
          usethis::use_github_release(quiet = TRUE);
          cat("Release v", new_ver, " created\n", sep="");
          '

      dry:
        help: Preview release actions without modifying repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rscript -e '
          ver <- read.dcf("DESCRIPTION", fields="Version")[1,1];
          next_patch <- paste0(
            gsub("(\\d+\\.\\d+\\.)(\\d+)", "\\1", ver),
            as.integer(gsub(".*\\.(\\d+)$", "\\1", ver)) + 1
          );
          cat(
            "[DRY] Current:",
            ver,
            "| Next patch:",
            next_patch,
            "\n"
          );
          '

      bump:
        help: Bump DESCRIPTION version (patch|minor|major)
        args:
          type:
            help: Version bump type
            type: string
            default: patch

        run: |
          Rscript -e '
          ver <- read.dcf("DESCRIPTION", fields="Version")[1,1];
          bump <- "${{ args.type }}";
          allowed <- c("patch", "minor", "major");
          if (!(bump %in% allowed)) {
            stop(
              paste0(
                "Invalid bump type: ",
                bump,
                ". Allowed values: patch, minor, major"
              )
            );
          }
          new_ver <- usethis:::bump_version(ver, bump);
          cat(
            "Bumped ",
            ver,
            " -> ",
            new_ver,
            "\n",
            sep=""
          );
          '
