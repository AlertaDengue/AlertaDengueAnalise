groups:
  deps:
    tasks:
      install:
        help: "Instalar dependências de R dentro do ambiente conda (CRAN + GitHub)."
        args:
          env:
            help: "Nome do ambiente conda."
            type: string
            default: alertadengueanalise
        env:
          MAKEFLAGS: "-j1"
          XONSH_SUBPROC_CMD_RAISE_ERROR: "True"
        backend: xonsh
        run: |
          $CONDA_EXE run --no-capture-output -n "${{ args.env }}" \
            Rscript --vanilla scripts/install_deps.R

      install-inla:
        help: Install and validate R-INLA (minimal)
        args:
          env:
            type: string
            help: Conda env name (optional; defaults to current env)
            required: false
        env:
          XONSH_SUBPROC_CMD_RAISE_ERROR: "True"
        backend: xonsh
        run: |
          bash scripts/install_inla.sh "${{ args.env }}"

      check:
        help: "Teste rápido de pacotes críticos após a instalação."
        args:
          env:
            help: "Nome do ambiente conda."
            type: string
            default: alertadengueanalise
        env:
          XONSH_SUBPROC_CMD_RAISE_ERROR: "True"
        backend: xonsh
        run: |
          $CONDA_EXE run --no-capture-output -n "${{ args.env }}" Rscript --vanilla -e \
            'stopifnot(requireNamespace("zendown"), requireNamespace("brpop"), requireNamespace("AlertTools")); cat("OK\n")'

  db:
    tasks:
      check:
        help: "Verificar conexão com o Postgres usando variáveis do arquivo .env."
        backend: bash
        args:
          env:
            help: "Nome do ambiente conda."
            type: string
            default: alertadengueanalise
        run: |
          set -euo pipefail

          if [ ! -f .env ]; then
            echo "ERRO: arquivo .env não encontrado na raiz do repositório."
            exit 2
          fi

          set -a
          . ./.env
          set +a

          ${CONDA_EXE:-conda} run --no-capture-output -n "${{ args.env }}" \
            Rscript --vanilla scripts/db_check.R

  pipeline:
    tasks:
      run-br:
        help: "Executar o pipeline BR para uma semana epidemiológica (YYYYWW)."
        backend: bash
        args:
          env:
            help: "Nome do ambiente conda."
            type: string
            default: alertadengueanalise
          week:
            help: "Semana epidemiológica no formato YYYYWW (ex.: 202601)."
            type: string
            required: true
          scp:
            help: "Se true, publica os .RData via SCP usando ALERTA_SCP_ENDPOINT e ALERTA_SCP_PATH do .env."
            type: bool
            default: false
          cores:
            help: "Número de estados processados em paralelo via parallel::mclapply em R."
            type: string
            default: "1"
        run: |
          set -euo pipefail

          if [ ! -f .env ]; then
            echo "ERRO: arquivo .env não encontrado na raiz do repositório."
            exit 2
          fi

          set -a
          . ./.env
          set +a

          if ! [[ "${{ args.week }}" =~ ^[0-9]{6}$ ]]; then
            echo "ERRO: --week deve estar no formato YYYYWW (6 dígitos), recebido '${{ args.week }}'."
            exit 2
          fi

          if ! [[ "${{ args.cores }}" =~ ^[0-9]+$ ]] || [ "${{ args.cores }}" -lt 1 ]; then
            echo "ERRO: --cores deve ser inteiro positivo."
            exit 2
          fi

          export ALERTA_DATA_RELATORIO="${{ args.week }}"
          export ALERTA_REPORT_EPIWEEK="${{ args.week }}"
          export ALERTA_DO_SCP="${{ args.scp }}"
          export ALERTA_PARALLEL_CORES="${{ args.cores }}"

          mkdir -p logs

          ${CONDA_EXE:-conda} run --no-capture-output -n "${{ args.env }}" \
            Rscript --vanilla main/main_BR.R 2>&1 | \
            tee -a "logs/pipeline-${{ args.week }}.log"

      refresh-alertas:
        help: "Executar geração BR de alertas, exportar SQL e carregar dengue/chik no banco."
        backend: bash
        args:
          env:
            help: "Nome do ambiente conda."
            type: string
            default: alertadengueanalise
          week:
            help: "Semana epidemiológica no formato YYYYWW."
            type: string
            required: true
          window-weeks:
            help: "Janela histórica em semanas para tabela_historico."
            type: string
            default: "100"
          states:
            help: "Lista opcional de UFs separadas por vírgula (ex.: RJ ou RJ,ES,MG)."
            type: string
            required: false
            default: ""
          load:
            help: "Se true, aplica os SQLs gerados no banco."
            type: bool
            default: false
          scp:
            help: "Se true, publica os .RData via SCP usando ALERTA_SCP_ENDPOINT e ALERTA_SCP_PATH do .env."
            type: bool
            default: false
          cores:
            help: "Número de estados processados em paralelo via parallel::mclapply em R."
            type: string
            default: "1"
        run: |
          set -euo pipefail

          if [ ! -f .env ]; then
            echo "ERRO: arquivo .env não encontrado na raiz do repositório."
            exit 2
          fi

          set -a
          . ./.env
          set +a

          WEEK="${{ args.week }}"

          if ! [[ "${WEEK}" =~ ^[0-9]{6}$ ]]; then
            echo "ERRO: semana epidemiológica inválida: ${WEEK}"
            exit 2
          fi

          if ! [[ "${{ args.window_weeks }}" =~ ^[0-9]+$ ]]; then
            echo "ERRO: --window-weeks deve ser inteiro positivo."
            exit 2
          fi

          if ! [[ "${{ args.cores }}" =~ ^[0-9]+$ ]] || [ "${{ args.cores }}" -lt 1 ]; then
            echo "ERRO: --cores deve ser inteiro positivo."
            exit 2
          fi

          DB_HOST="${ALERTA_DB_HOST:-${DB_HOST:-}}"
          DB_PORT="${ALERTA_DB_PORT:-${DB_PORT:-5432}}"
          DB_NAME="${ALERTA_DB_NAME:-${DB_NAME:-}}"
          DB_USER="${ALERTA_DB_USER:-${DB_USER:-}}"
          DB_PASS="${ALERTA_DB_PASSWORD:-${DB_PASSWORD:-}}"

          if [ -z "${DB_HOST}" ] || [ -z "${DB_NAME}" ] || [ -z "${DB_USER}" ] || [ -z "${DB_PASS}" ]; then
            echo "ERRO: faltam variáveis de banco. Verifique ALERTA_DB_* ou DB_* no .env."
            exit 2
          fi

          export ALERTA_DATA_RELATORIO="${WEEK}"
          export ALERTA_REPORT_EPIWEEK="${WEEK}"
          export ALERTA_WINDOW_WEEKS="${{ args.window_weeks }}"
          export ALERTA_DO_SCP="${{ args.scp }}"
          export ALERTA_STATES="${{ args.states }}"
          export ALERTA_PARALLEL_CORES="${{ args.cores }}"

          mkdir -p logs

          LOG_FILE="logs/refresh-alertas-${WEEK}.log"

          echo "[II] week=${WEEK}" | tee -a "${LOG_FILE}"
          echo "[II] window_weeks=${{ args.window_weeks }}" | tee -a "${LOG_FILE}"
          echo "[II] cores=${{ args.cores }}" | tee -a "${LOG_FILE}"

          if [ -n "${{ args.states }}" ]; then
            echo "[II] states=${{ args.states }}" | tee -a "${LOG_FILE}"
          else
            echo "[II] states=ALL" | tee -a "${LOG_FILE}"
          fi

          ${CONDA_EXE:-conda} run --no-capture-output -n "${{ args.env }}" \
            Rscript --vanilla main/main_BR.R 2>&1 | \
            tee -a "${LOG_FILE}"

          if [ "${{ args.load }}" != "True" ]; then
            echo "[II] load=false, skipping SQL apply." | tee -a "${LOG_FILE}"
            exit 0
          fi

          if [ -f main/sql/output_dengue.sql ]; then
            echo "[II] applying main/sql/output_dengue.sql" | tee -a "${LOG_FILE}"
            PGPASSWORD="${DB_PASS}" \
              psql \
                -v ON_ERROR_STOP=1 \
                -h "${DB_HOST}" \
                -p "${DB_PORT}" \
                -U "${DB_USER}" \
                -d "${DB_NAME}" \
                -f main/sql/output_dengue.sql 2>&1 | \
              tee -a "${LOG_FILE}"
          else
            echo "[WW] output_dengue.sql not found, skipping." | tee -a "${LOG_FILE}"
          fi

          if [ -f main/sql/output_chik.sql ]; then
            echo "[II] applying main/sql/output_chik.sql" | tee -a "${LOG_FILE}"
            PGPASSWORD="${DB_PASS}" \
              psql \
                -v ON_ERROR_STOP=1 \
                -h "${DB_HOST}" \
                -p "${DB_PORT}" \
                -U "${DB_USER}" \
                -d "${DB_NAME}" \
                -f main/sql/output_chik.sql 2>&1 | \
              tee -a "${LOG_FILE}"
          else
            echo "[WW] output_chik.sql not found, skipping." | tee -a "${LOG_FILE}"
          fi

          echo "[II] refresh-alertas completed successfully." | tee -a "${LOG_FILE}"

      maps-state:
        help: "Gerar mapas estaduais de incidência acumulada nas últimas SEs."
        backend: bash
        args:
          env:
            help: "Nome do ambiente conda."
            type: string
            default: alertadengueanalise
          week:
            help: "Semana epidemiológica no formato YYYYWW, ou 'latest'."
            type: string
            default: latest
          states:
            help: "Lista de UFs separadas por vírgula, ou ALL para todos os estados."
            type: string
            default: ALL
          diseases:
            help: "Lista de agravos separadas por vírgula: dengue, chikungunya, zika, ou ALL."
            type: string
            default: ALL
          output-dir:
            help: "Diretório de saída dos mapas estaduais."
            type: string
            default: sync_maps/incidence_maps/state
          window-weeks:
            help: "Número de semanas usadas para acumular incidência."
            type: string
            default: "4"
        run: |
          set -euo pipefail

          if [ ! -f .env ]; then
            echo "ERRO: arquivo .env não encontrado na raiz do repositório."
            exit 2
          fi

          set -a
          . ./.env
          set +a

          WEEK="${{ args.week }}"

          if [ "${WEEK}" != "latest" ] && ! [[ "${WEEK}" =~ ^[0-9]{6}$ ]]; then
            echo "ERRO: --week deve ser 'latest' ou uma SE no formato YYYYWW, recebido '${WEEK}'."
            exit 2
          fi

          if ! [[ "${{ args.window_weeks }}" =~ ^[0-9]+$ ]]; then
            echo "ERRO: --window-weeks deve ser inteiro positivo."
            exit 2
          fi

          export ALERTA_MAP_EPIWEEK="${WEEK}"
          export ALERTA_MAP_STATES="${{ args.states }}"
          export ALERTA_MAP_DISEASES="${{ args.diseases }}"
          export ALERTA_MAP_OUTPUT_DIR="${{ args.output_dir }}"
          export ALERTA_MAP_WINDOW_WEEKS="${{ args.window_weeks }}"

          CONDA_BIN="${CONDA_EXE:-conda}"

          CONDA_PREFIX_RESOLVED="$(
            ${CONDA_BIN} run --no-capture-output -n "${{ args.env }}" \
              python -c 'import sys; print(sys.prefix)'
          )"

          if [ -z "${CONDA_PREFIX_RESOLVED}" ]; then
            echo "ERRO: não foi possível resolver o prefixo do ambiente conda '${{ args.env }}'."
            exit 2
          fi

          export PATH="${CONDA_PREFIX_RESOLVED}/bin:${PATH}"

          if [ -f "${CONDA_PREFIX_RESOLVED}/share/proj/proj.db" ]; then
            export PROJ_LIB="${CONDA_PREFIX_RESOLVED}/share/proj"
            export PROJ_DATA="${CONDA_PREFIX_RESOLVED}/share/proj"
          fi

          if [ -d "${CONDA_PREFIX_RESOLVED}/share/gdal" ]; then
            export GDAL_DATA="${CONDA_PREFIX_RESOLVED}/share/gdal"
          fi

          mkdir -p logs
          LOG_FILE="logs/maps-state-${WEEK}.log"

          echo "[II] week=${WEEK}" | tee -a "${LOG_FILE}"
          echo "[II] states=${{ args.states }}" | tee -a "${LOG_FILE}"
          echo "[II] diseases=${{ args.diseases }}" | tee -a "${LOG_FILE}"
          echo "[II] window_weeks=${{ args.window_weeks }}" | tee -a "${LOG_FILE}"
          echo "[II] output_dir=${{ args.output_dir }}" | tee -a "${LOG_FILE}"

          ${CONDA_BIN} run --no-capture-output -n "${{ args.env }}" \
            Rscript --vanilla incidence_maps/state.R 2>&1 | \
            tee -a "${LOG_FILE}"


      maps-br:
        help: "Gerar mapas nacionais de incidência acumulada nas últimas SEs."
        backend: bash
        args:
          env:
            help: "Nome do ambiente conda."
            type: string
            default: alertadengueanalise
          week:
            help: "Semana epidemiológica no formato YYYYWW, ou 'latest'."
            type: string
            default: latest
          diseases:
            help: "Lista de agravos separadas por vírgula: dengue, chikungunya, ou ALL."
            type: string
            default: ALL
          window-weeks:
            help: "Número de semanas usadas para acumular incidência."
            type: string
            default: "4"
          output-dir:
            help: "Diretório de saída dos mapas nacionais."
            type: string
            default: sync_maps/incidence_maps/country
        run: |
          set -euo pipefail

          if [ ! -f .env ]; then
            echo "ERRO: arquivo .env não encontrado na raiz do repositório."
            exit 2
          fi

          set -a
          . ./.env
          set +a

          WEEK="${{ args.week }}"

          if [ "${WEEK}" != "latest" ] && ! [[ "${WEEK}" =~ ^[0-9]{6}$ ]]; then
            echo "ERRO: --week deve ser 'latest' ou uma SE no formato YYYYWW, recebido '${WEEK}'."
            exit 2
          fi

          if ! [[ "${{ args.window_weeks }}" =~ ^[0-9]+$ ]]; then
            echo "ERRO: --window-weeks deve ser inteiro positivo."
            exit 2
          fi

          export ALERTA_MAP_BR_EPIWEEK="${WEEK}"
          export ALERTA_MAP_BR_DISEASES="${{ args.diseases }}"
          export ALERTA_MAP_BR_WINDOW_WEEKS="${{ args.window_weeks }}"
          export ALERTA_MAP_BR_OUTPUT_DIR="${{ args.output_dir }}"

          CONDA_BIN="${CONDA_EXE:-conda}"

          CONDA_PREFIX_RESOLVED="$(
            ${CONDA_BIN} run --no-capture-output -n "${{ args.env }}" \
              python -c 'import sys; print(sys.prefix)'
          )"

          if [ -z "${CONDA_PREFIX_RESOLVED}" ]; then
            echo "ERRO: não foi possível resolver o prefixo do ambiente conda '${{ args.env }}'."
            exit 2
          fi

          export PATH="${CONDA_PREFIX_RESOLVED}/bin:${PATH}"

          if [ -f "${CONDA_PREFIX_RESOLVED}/share/proj/proj.db" ]; then
            export PROJ_LIB="${CONDA_PREFIX_RESOLVED}/share/proj"
            export PROJ_DATA="${CONDA_PREFIX_RESOLVED}/share/proj"
          fi

          if [ -d "${CONDA_PREFIX_RESOLVED}/share/gdal" ]; then
            export GDAL_DATA="${CONDA_PREFIX_RESOLVED}/share/gdal"
          fi

          mkdir -p logs

          LOG_FILE="logs/maps-br-${WEEK}.log"

          echo "[II] week=${WEEK}" | tee -a "${LOG_FILE}"
          echo "[II] diseases=${{ args.diseases }}" | tee -a "${LOG_FILE}"
          echo "[II] window_weeks=${{ args.window_weeks }}" | tee -a "${LOG_FILE}"
          echo "[II] output_dir=${{ args.output_dir }}" | tee -a "${LOG_FILE}"
          echo "[II] conda_prefix=${CONDA_PREFIX_RESOLVED}" | tee -a "${LOG_FILE}"
          echo "[II] PROJ_LIB=${PROJ_LIB:-}" | tee -a "${LOG_FILE}"
          echo "[II] PROJ_DATA=${PROJ_DATA:-}" | tee -a "${LOG_FILE}"
          echo "[II] GDAL_DATA=${GDAL_DATA:-}" | tee -a "${LOG_FILE}"

          ${CONDA_BIN} run --no-capture-output -n "${{ args.env }}" \
            Rscript --vanilla incidence_maps/br.R 2>&1 | \
            tee -a "${LOG_FILE}"
  release:
    tasks:
      ci:
        help: Create GitHub release + bump DESCRIPTION version (patch)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rscript -e '
          ver <- read.dcf("DESCRIPTION", fields="Version")[1,1];
          new_ver <- usethis:::bump_version(ver, "patch");
          cat("Bumped to:", new_ver, "\n");
          usethis::use_github_release(quiet = TRUE);
          cat("Release v", new_ver, " created\n", sep="");
          '

      dry:
        help: Preview release actions without modifying repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rscript -e '
          ver <- read.dcf("DESCRIPTION", fields="Version")[1,1];
          next_patch <- paste0(
            gsub("(\\d+\\.\\d+\\.)(\\d+)", "\\1", ver),
            as.integer(gsub(".*\\.(\\d+)$", "\\1", ver)) + 1
          );
          cat(
            "[DRY] Current:",
            ver,
            "| Next patch:",
            next_patch,
            "\n"
          );
          '

      bump:
        help: Bump DESCRIPTION version (patch|minor|major)
        args:
          type:
            help: Version bump type
            type: string
            default: patch

        run: |
          Rscript -e '
          ver <- read.dcf("DESCRIPTION", fields="Version")[1,1];
          bump <- "${{ args.type }}";
          allowed <- c("patch", "minor", "major");
          if (!(bump %in% allowed)) {
            stop(
              paste0(
                "Invalid bump type: ",
                bump,
                ". Allowed values: patch, minor, major"
              )
            );
          }
          new_ver <- usethis:::bump_version(ver, bump);
          cat(
            "Bumped ",
            ver,
            " -> ",
            new_ver,
            "\n",
            sep=""
          );
          '
