groups:
  deps:
    tasks:
      install:
        help: "Instalar dependências de R dentro do ambiente conda (CRAN + GitHub)."
        args:
          env:
            help: "Nome do ambiente conda."
            type: string
            default: alertadengueanalise
        env:
          MAKEFLAGS: "-j1"
          XONSH_SUBPROC_CMD_RAISE_ERROR: "True"
        backend: xonsh
        run: |
          $CONDA_EXE run --no-capture-output -n "${{ args.env }}" \
            Rscript --vanilla scripts/install_deps.R

      install-inla:
        help: Install and validate R-INLA (minimal)
        args:
          env:
            type: string
            help: Conda env name (optional; defaults to current env)
            required: false
        env:
          XONSH_SUBPROC_CMD_RAISE_ERROR: "True"
        backend: xonsh
        run: |
          bash scripts/install_inla.sh "${{ args.env }}"

      check:
        help: "Teste rápido de pacotes críticos após a instalação."
        args:
          env:
            help: "Nome do ambiente conda."
            type: string
            default: alertadengueanalise
        env:
          XONSH_SUBPROC_CMD_RAISE_ERROR: "True"
        backend: xonsh
        run: |
          $CONDA_EXE run --no-capture-output -n "${{ args.env }}" Rscript --vanilla -e \
            'stopifnot(requireNamespace("zendown"), requireNamespace("brpop"), requireNamespace("AlertTools")); cat("OK\n")'

  db:
    tasks:
      check:
        help: "Verificar conexão com o Postgres usando variáveis do arquivo .env."
        backend: bash
        args:
          env:
            help: "Nome do ambiente conda."
            type: string
            default: alertadengueanalise
        run: |
          set -euo pipefail

          if [ ! -f .env ]; then
            echo "ERRO: arquivo .env não encontrado na raiz do repositório."
            exit 2
          fi

          set -a
          . ./.env
          set +a

          ${CONDA_EXE:-conda} run --no-capture-output -n "${{ args.env }}" \
            Rscript --vanilla scripts/db_check.R

  pipeline:
    tasks:
      run-br:
        help: "Executar o pipeline BR para uma semana epidemiológica (YYYYWW)."
        backend: bash
        args:
          env:
            help: "Nome do ambiente conda."
            type: string
            default: alertadengueanalise
          week:
            help: "Semana epidemiológica no formato YYYYWW (ex.: 202601)."
            type: string
            required: true
          scp:
            help: "Se true, publica os .RData via SCP usando ALERTA_SCP_ENDPOINT e ALERTA_SCP_PATH do .env."
            type: bool
            default: false
        run: |
          set -euo pipefail

          if [ ! -f .env ]; then
            echo "ERRO: arquivo .env não encontrado na raiz do repositório."
            exit 2
          fi

          set -a
          . ./.env
          set +a

          if ! [[ "${{ args.week }}" =~ ^[0-9]{6}$ ]]; then
            echo "ERRO: --week deve estar no formato YYYYWW (6 dígitos), recebido '${{ args.week }}'."
            exit 2
          fi

          export ALERTA_DATA_RELATORIO="${{ args.week }}"
          export ALERTA_REPORT_EPIWEEK="${{ args.week }}"
          export ALERTA_DO_SCP="${{ args.scp }}"

          mkdir -p logs

          ${CONDA_EXE:-conda} run --no-capture-output -n "${{ args.env }}" \
            Rscript --vanilla main/main_BR.R 2>&1 | \
            tee -a "logs/pipeline-${{ args.week }}.log"

      refresh-alertas:
        help: "Executar geração BR de alertas, exportar SQL e carregar dengue/chik no banco."
        backend: bash
        args:
          env:
            help: "Nome do ambiente conda."
            type: string
            default: alertadengueanalise
          week:
            help: "Semana epidemiológica no formato YYYYWW."
            type: string
            required: true
          window-weeks:
            help: "Janela histórica em semanas para tabela_historico."
            type: string
            default: "100"
          states:
            help: "Lista opcional de UFs separadas por vírgula (ex.: RJ ou RJ,ES,MG)."
            type: string
            required: false
            default: ""
          load:
            help: "Se true, aplica os SQLs gerados no banco."
            type: bool
            default: false
          scp:
            help: "Se true, publica os .RData via SCP usando ALERTA_SCP_ENDPOINT e ALERTA_SCP_PATH do .env."
            type: bool
            default: false
        run: |
          set -euo pipefail

          if [ ! -f .env ]; then
            echo "ERRO: arquivo .env não encontrado na raiz do repositório."
            exit 2
          fi

          set -a
          . ./.env
          set +a

          WEEK="${{ args.week }}"

          if ! [[ "${WEEK}" =~ ^[0-9]{6}$ ]]; then
            echo "ERRO: semana epidemiológica inválida: ${WEEK}"
            exit 2
          fi

          if ! [[ "${{ args.window_weeks }}" =~ ^[0-9]+$ ]]; then
            echo "ERRO: --window-weeks deve ser inteiro positivo."
            exit 2
          fi

          DB_HOST="${ALERTA_DB_HOST:-${DB_HOST:-}}"
          DB_PORT="${ALERTA_DB_PORT:-${DB_PORT:-5432}}"
          DB_NAME="${ALERTA_DB_NAME:-${DB_NAME:-}}"
          DB_USER="${ALERTA_DB_USER:-${DB_USER:-}}"
          DB_PASS="${ALERTA_DB_PASSWORD:-${DB_PASSWORD:-}}"

          if [ -z "${DB_HOST}" ] || [ -z "${DB_NAME}" ] || [ -z "${DB_USER}" ] || [ -z "${DB_PASS}" ]; then
            echo "ERRO: faltam variáveis de banco. Verifique ALERTA_DB_* ou DB_* no .env."
            exit 2
          fi

          export ALERTA_DATA_RELATORIO="${WEEK}"
          export ALERTA_REPORT_EPIWEEK="${WEEK}"
          export ALERTA_WINDOW_WEEKS="${{ args.window_weeks }}"
          export ALERTA_DO_SCP="${{ args.scp }}"
          export ALERTA_STATES="${{ args.states }}"

          mkdir -p logs

          LOG_FILE="logs/refresh-alertas-${WEEK}.log"

          echo "[II] week=${WEEK}" | tee -a "${LOG_FILE}"
          echo "[II] window_weeks=${{ args.window_weeks }}" | tee -a "${LOG_FILE}"

          if [ -n "${{ args.states }}" ]; then
            echo "[II] states=${{ args.states }}" | tee -a "${LOG_FILE}"
          else
            echo "[II] states=ALL" | tee -a "${LOG_FILE}"
          fi

          ${CONDA_EXE:-conda} run --no-capture-output -n "${{ args.env }}" \
            Rscript --vanilla main/main_BR.R 2>&1 | \
            tee -a "${LOG_FILE}"

          if [ "${{ args.load }}" != "True" ]; then
            echo "[II] load=false, skipping SQL apply." | tee -a "${LOG_FILE}"
            exit 0
          fi

          if [ -f main/sql/output_dengue.sql ]; then
            echo "[II] applying main/sql/output_dengue.sql" | tee -a "${LOG_FILE}"
            PGPASSWORD="${DB_PASS}" \
              psql \
                -v ON_ERROR_STOP=1 \
                -h "${DB_HOST}" \
                -p "${DB_PORT}" \
                -U "${DB_USER}" \
                -d "${DB_NAME}" \
                -f main/sql/output_dengue.sql 2>&1 | \
              tee -a "${LOG_FILE}"
          else
            echo "[WW] output_dengue.sql not found, skipping." | tee -a "${LOG_FILE}"
          fi

          if [ -f main/sql/output_chik.sql ]; then
            echo "[II] applying main/sql/output_chik.sql" | tee -a "${LOG_FILE}"
            PGPASSWORD="${DB_PASS}" \
              psql \
                -v ON_ERROR_STOP=1 \
                -h "${DB_HOST}" \
                -p "${DB_PORT}" \
                -U "${DB_USER}" \
                -d "${DB_NAME}" \
                -f main/sql/output_chik.sql 2>&1 | \
              tee -a "${LOG_FILE}"
          else
            echo "[WW] output_chik.sql not found, skipping." | tee -a "${LOG_FILE}"
          fi

          echo "[II] refresh-alertas completed successfully." | tee -a "${LOG_FILE}"
